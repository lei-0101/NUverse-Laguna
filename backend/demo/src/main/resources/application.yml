spring:
  application:
    name: nuverse-laguna
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nuverse_laguna}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:3MB}
      max-request-size: ${MAX_REQUEST_SIZE:5MB}

server:
  port: ${PORT:8080}

app:
  base-url: ${BASE_URL:http://localhost:8080}
  jwt:
    secret: ${JWT_SECRET:nuverse-laguna-dev-secret-key-change-in-production-min-32}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: access_token
    cookie-secure: ${COOKIE_SECURE:false}
    cookie-same-site: ${COOKIE_SAME_SITE:Strict}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    allowed-email-domains:
      - ${AUTH_EMAIL_DOMAIN:national-u.edu.ph}
  rate-limit:
    auth-requests-per-minute: ${RATE_LIMIT_AUTH:5}
    api-requests-per-minute: ${RATE_LIMIT_API:60}
  storage:
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
    public-prefix: /uploads
    max-image-bytes: ${STORAGE_MAX_IMAGE_BYTES:2097152}
