# Datasource is auto-configured by @ServiceConnection (Testcontainers)
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

app:
  base-url: http://localhost:8080
  jwt:
    secret: nuverse-laguna-test-secret-key-change-in-production-min-32
    expiration-ms: 3600000
    cookie-name: access_token
    cookie-secure: false
    cookie-same-site: Strict
  cors:
    allowed-origins: http://localhost:5173
  auth:
    allowed-email-domains:
      - students.nu-laguna.edu.ph
  rate-limit:
    auth-requests-per-minute: 100
    api-requests-per-minute: 1000
